name: Release builds

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Cross-compile all targets
        run: zig build release

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          # zig build release installs each target to zig-out/<name>/hqlc(.exe)
          for d in zig-out/*/; do
            name=$(basename "$d")
            if [ -f "${d}hqlc.exe" ]; then
              zip -qj "dist/hqlc-$name.zip" "${d}hqlc.exe"
            else
              tar -C "$d" -czf "dist/hqlc-$name.tar.gz" hqlc
            fi
          done
          ls -la dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz dist/*.zip --clobber
