name: Deploy ABX test to GitHub Pages

on:
  push:
    branches: [abx-release]
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so `git describe` can stamp the build

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16

      - name: Build WASM
        working-directory: misc/abx-test-web
        run: |
          emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release
          emmake make -C build -j"$(nproc)"

      - name: Assemble site
        working-directory: misc/abx-test-web
        run: |
          mkdir -p _site
          cp index.html abx.css abx_config.js _site/
          cp -r js _site/
          cp build/abx_codecs.js build/abx_codecs.wasm _site/

      - name: Inject runtime config
        working-directory: misc/abx-test-web
        env:
          ABX_RESULTS_ENDPOINT: ${{ secrets.ABX_RESULTS_ENDPOINT }}
          ABX_RESULTS_TOKEN: ${{ secrets.ABX_RESULTS_TOKEN }}
        run: |
          # Stamp the codec build this deploy was compiled from
          ABX_VERSION="$(git describe --tags --always 2>/dev/null || echo unknown)" \
          node - <<'NODE'
          const fs = require("fs");
          const cfg = {
            endpoint: process.env.ABX_RESULTS_ENDPOINT || "",
            token: process.env.ABX_RESULTS_TOKEN || "",
            version: process.env.ABX_VERSION || "",
          };
          fs.writeFileSync(
            "_site/abx_config.js",
            "window.ABX_CONFIG = " + JSON.stringify(cfg) + ";\n"
          );
          NODE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: misc/abx-test-web/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
